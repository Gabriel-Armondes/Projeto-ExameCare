services:
  postgres:
    image: postgres:16-alpine
    container_name: examecare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: examecare
    ports:
      - "5432:5432"
    volumes:
      - examecare-postgres-data:/var/lib/postgresql/data

volumes:
  examecare-postgres-data:
